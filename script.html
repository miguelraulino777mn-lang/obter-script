<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevHub Lua - Script Menu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f17;
    color: #fff;
    font-family: -apple-system, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .caixa {
    background: #1a1a26;
    border-radius: 20px;
    padding: 30px 24px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 26px;
    margin-bottom: 8px;
    text-align: center;
    background: linear-gradient(90deg, #00ff9d, #00aaff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    color: #8888aa;
    font-size: 13px;
    margin-bottom: 22px;
    text-align: center;
  }
  .tarefa {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0f0f17;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 2px solid transparent;
    transition: border 0.3s;
  }
  .tarefa.completa { border-color: #00aaff; }
  .tarefa-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
  }
  .bolinha {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .bolinha.azul {
    background: #00aaff;
    box-shadow: 0 0 10px #00aaff;
  }
  .tarefa-nome {
    font-size: 14px;
    color: #ccc;
  }
  .btn-tarefa {
    background: #2a2a38;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    min-width: 80px;
  }
  .btn-tarefa:disabled {
    background: #1a1a26;
    color: #555;
    cursor: not-allowed;
  }
  .btn-tarefa.feito {
    background: #00aaff;
    color: #0f0f17;
  }
  .btn-tarefa.contando {
    background: #ffaa00;
    color: #0f0f17;
  }
  .btn-principal {
    background: linear-gradient(90deg, #00ff9d, #00aaff);
    color: #0f0f17;
    border: none;
    padding: 15px;
    width: 100%;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
  }
  .btn-principal:active { transform: scale(0.97); }
  .btn-principal:disabled {
    background: #2a2a38;
    color: #555;
    cursor: not-allowed;
  }
  .btn-key {
    background: linear-gradient(90deg, #ffaa00, #ff6464);
    color: #0f0f17;
    border: none;
    padding: 15px;
    width: 100%;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-key:active { transform: scale(0.97); }
  .tela { display: none; }
  .tela.ativa { display: block; }
  .script-box {
    background: #0a0a10;
    border: 2px solid #00ff9d;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 15px;
    max-height: 400px;
    overflow-y: auto;
  }
  textarea {
    width: 100%;
    min-height: 360px;
    background: transparent;
    color: #00ff9d;
    border: none;
    font-family: monospace;
    font-size: 11px;
    resize: vertical;
    outline: none;
    line-height: 1.4;
  }
  .aviso {
    background: #1a2a30;
    border-left: 3px solid #00aaff;
    padding: 12px;
    border-radius: 8px;
    font-size: 12px;
    color: #88ccff;
    text-align: left;
    margin-bottom: 15px;
    line-height: 1.5;
  }
  .passo {
    color: #666688;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 15px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="caixa">

    <!-- TELA 1: TAREFAS -->
    <div class="tela ativa" id="tela1">
      <h1>📜 Script Menu</h1>
      <p class="sub">Complete as 4 tarefas pra liberar o script</p>

      <div class="tarefa" id="tar1">
        <div class="tarefa-info">
          <div class="bolinha" id="bol1"></div>
          <span class="tarefa-nome">Seguir no Instagram</span>
        </div>
        <button class="btn-tarefa" id="btn1" onclick="iniciarTarefa(1)">Seguir</button>
      </div>

      <div class="tarefa" id="tar2">
        <div class="tarefa-info">
          <div class="bolinha" id="bol2"></div>
          <span class="tarefa-nome">Assistir o vídeo</span>
        </div>
        <button class="btn-tarefa" id="btn2" onclick="iniciarTarefa(2)">Assistir</button>
      </div>

      <div class="tarefa" id="tar3">
        <div class="tarefa-info">
          <div class="bolinha" id="bol3"></div>
          <span class="tarefa-nome">Entrar no Discord</span>
        </div>
        <button class="btn-tarefa" id="btn3" onclick="iniciarTarefa(3)">Entrar</button>
      </div>

      <div class="tarefa" id="tar4">
        <div class="tarefa-info">
          <div class="bolinha" id="bol4"></div>
          <span class="tarefa-nome">Compartilhar com amigo</span>
        </div>
        <button class="btn-tarefa" id="btn4" onclick="iniciarTarefa(4)">Enviar</button>
      </div>

      <button class="btn-principal" id="btnVer" disabled onclick="verScript()">
        🔒 Ver Script
      </button>
    </div>

    <!-- TELA 2: SCRIPT -->
    <div class="tela" id="tela2">
      <p class="passo">SCRIPT LIBERADO</p>
      <h1>📜 Menu de Teleporte</h1>
      <p class="sub">Copie e cole no seu executor</p>

      <div class="aviso">
        ⚠️ Depois de colar no executor, clique no botão <b>"🔑 Obter Key"</b> pra pegar sua key no site.
      </div>

      <div class="script-box">
        <textarea id="script" readonly></textarea>
      </div>

      <button class="btn-principal" onclick="copiarScript()" id="btnCopiar">
        📋 Copiar Script
      </button>

      <button class="btn-key" onclick="irParaKey()">
        🔑 Obter Key
      </button>
    </div>

  </div>

<script>
  const links = {
    1: "https://www.instagram.com/dxx_miguelll",
    2: "https://youtu.be/Gs4KY7ioco4",
    3: "https://discord.gg/UwmWXUwkz",
    4: "https://wa.me/?text=Olha%20esse%20script%20massa%3A%20https%3A%2F%2Fmiguelraulino777mn-lang.github.io%2Fscript-menu",
  };

  const tarefas = { 1: false, 2: false, 3: false, 4: false };

  function iniciarTarefa(num) {
    if (tarefas[num]) return;
    const btn = document.getElementById("btn" + num);
    window.open(links[num], "_blank");
    btn.disabled = true;
    btn.classList.add("contando");
    let tempo = 60;
    btn.innerText = tempo + "s";
    const intervalo = setInterval(() => {
      tempo--;
      btn.innerText = tempo + "s";
      if (tempo <= 0) {
        clearInterval(intervalo);
        tarefas[num] = true;
        btn.classList.remove("contando");
        btn.classList.add("feito");
        btn.innerText = "✓";
        document.getElementById("bol" + num).classList.add("azul");
        document.getElementById("tar" + num).classList.add("completa");
        checarTudo();
      }
    }, 1000);
  }

  function checarTudo() {
    const todas = Object.values(tarefas).every(v => v === true);
    const btn = document.getElementById("btnVer");
    if (todas) {
      btn.disabled = false;
      btn.innerText = "📜 Ver Script";
    }
  }

  const SCRIPT_LUA = "--==================================================\n" +
"-- MENU DE TELEPORTE + KEY\n" +
"-- LocalScript em: Gui Inicial\n" +
"--==================================================\n" +
"\n" +
"local Players = game:GetService(\"Players\")\n" +
"local jogador = Players.LocalPlayer\n" +
"\n" +
"-- GERA AS 300 KEYS\n" +
"local function gerarKey(numero)\n" +
"  local chars = \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\"\n" +
"  local key = \"\"\n" +
"  local semente = numero * 77777 + 12345\n" +
"  for i = 1, 8 do\n" +
"    semente = (semente * 9301 + 49297) % 233280\n" +
"    local pos = (semente % #chars) + 1\n" +
"    key = key .. chars:sub(pos, pos)\n" +
"  end\n" +
"  return \"LUA-\" .. key\n" +
"end\n" +
"\n" +
"local keys = {}\n" +
"for i = 1, 300 do\n" +
"  keys[i] = gerarKey(i)\n" +
"end\n" +
"\n" +
"local function keyValida(digitada)\n" +
"  for _, k in ipairs(keys) do\n" +
"    if k == digitada then return true end\n" +
"  end\n" +
"  return false\n" +
"end\n" +
"\n" +
"local jaValidou = false\n" +
"\n" +
"-- GUI\n" +
"local gui = Instance.new(\"ScreenGui\")\n" +
"gui.Name = \"MenuTeleport\"\n" +
"gui.ResetOnSpawn = false\n" +
"gui.Parent = jogador:WaitForChild(\"PlayerGui\")\n" +
"\n" +
"local abrir = Instance.new(\"TextButton\")\n" +
"abrir.Size = UDim2.new(0, 55, 0, 55)\n" +
"abrir.Position = UDim2.new(0, 15, 0.5, -27)\n" +
"abrir.BackgroundColor3 = Color3.fromRGB(25, 25, 35)\n" +
"abrir.Text = \"TP\"\n" +
"abrir.TextColor3 = Color3.new(1,1,1)\n" +
"abrir.TextSize = 18\n" +
"abrir.Font = Enum.Font.GothamBold\n" +
"abrir.Parent = gui\n" +
"\n" +
"local canto = Instance.new(\"UICorner\")\n" +
"canto.CornerRadius = UDim.new(0, 15)\n" +
"canto.Parent = abrir\n" +
"\n" +
"-- TELA DE KEY\n" +
"local telaKey = Instance.new(\"Frame\")\n" +
"telaKey.Size = UDim2.new(0, 300, 0, 280)\n" +
"telaKey.Position = UDim2.new(0.5, -150, 0.5, -140)\n" +
"telaKey.BackgroundColor3 = Color3.fromRGB(20, 20, 28)\n" +
"telaKey.Visible = false\n" +
"telaKey.Parent = gui\n" +
"\n" +
"local cantoTelaKey = Instance.new(\"UICorner\")\n" +
"cantoTelaKey.CornerRadius = UDim.new(0, 18)\n" +
"cantoTelaKey.Parent = telaKey\n" +
"\n" +
"local tituloKey = Instance.new(\"TextLabel\")\n" +
"tituloKey.Size = UDim2.new(1, 0, 0, 45)\n" +
"tituloKey.Position = UDim2.new(0, 0, 0, 5)\n" +
"tituloKey.BackgroundTransparency = 1\n" +
"tituloKey.Text = \"DIGITE SUA KEY\"\n" +
"tituloKey.TextColor3 = Color3.new(1, 1, 1)\n" +
"tituloKey.TextSize = 20\n" +
"tituloKey.Font = Enum.Font.GothamBold\n" +
"tituloKey.Parent = telaKey\n" +
"\n" +
"local subtituloKey = Instance.new(\"TextLabel\")\n" +
"subtituloKey.Size = UDim2.new(1, -20, 0, 25)\n" +
"subtituloKey.Position = UDim2.new(0, 10, 0, 50)\n" +
"subtituloKey.BackgroundTransparency = 1\n" +
"subtituloKey.Text = \"Pegue a key no site\"\n" +
"subtituloKey.TextColor3 = Color3.fromRGB(136, 136, 170)\n" +
"subtituloKey.TextSize = 13\n" +
"subtituloKey.Font = Enum.Font.Gotham\n" +
"subtituloKey.Parent = telaKey\n" +
"\n" +
"local caixaKey = Instance.new(\"TextBox\")\n" +
"caixaKey.Size = UDim2.new(1, -40, 0, 45)\n" +
"caixaKey.Position = UDim2.new(0, 20, 0, 85)\n" +
"caixaKey.BackgroundColor3 = Color3.fromRGB(35, 35, 48)\n" +
"caixaKey.PlaceholderText = \"Cole sua key aqui...\"\n" +
"caixaKey.Text = \"\"\n" +
"caixaKey.ClearTextOnFocus = false\n" +
"caixaKey.TextColor3 = Color3.new(1, 1, 1)\n" +
"caixaKey.TextSize = 16\n" +
"caixaKey.Font = Enum.Font.Gotham\n" +
"caixaKey.Parent = telaKey\n" +
"\n" +
"local cantoCaixa = Instance.new(\"UICorner\")\n" +
"cantoCaixa.CornerRadius = UDim.new(0, 10)\n" +
"cantoCaixa.Parent = caixaKey\n" +
"\n" +
"local botaoConfirmar = Instance.new(\"TextButton\")\n" +
"botaoConfirmar.Size = UDim2.new(1, -40, 0, 45)\n" +
"botaoConfirmar.Position = UDim2.new(0, 20, 0, 140)\n" +
"botaoConfirmar.BackgroundColor3 = Color3.fromRGB(0, 170, 100)\n" +
"botaoConfirmar.Text = \"CONFIRMAR\"\n" +
"botaoConfirmar.TextColor3 = Color3.new(1, 1, 1)\n" +
"botaoConfirmar.TextSize = 16\n" +
"botaoConfirmar.Font = Enum.Font.GothamBold\n" +
"botaoConfirmar.Parent = telaKey\n" +
"\n" +
"local cantoBotaoConf = Instance.new(\"UICorner\")\n" +
"cantoBotaoConf.CornerRadius = UDim.new(0, 10)\n" +
"cantoBotaoConf.Parent = botaoConfirmar\n" +
"\n" +
"local botaoObter = Instance.new(\"TextButton\")\n" +
"botaoObter.Size = UDim2.new(1, -40, 0, 40)\n" +
"botaoObter.Position = UDim2.new(0, 20, 0, 195)\n" +
"botaoObter.BackgroundColor3 = Color3.fromRGB(35, 35, 48)\n" +
"botaoObter.Text = \"Obter Key no site\"\n" +
"botaoObter.TextColor3 = Color3.fromRGB(0, 200, 255)\n" +
"botaoObter.TextSize = 14\n" +
"botaoObter.Font = Enum.Font.GothamSemibold\n" +
"botaoObter.Parent = telaKey\n" +
"\n" +
"local cantoBotaoObter = Instance.new(\"UICorner\")\n" +
"cantoBotaoObter.CornerRadius = UDim.new(0, 10)\n" +
"cantoBotaoObter.Parent = botaoObter\n" +
"\n" +
"local avisoKey = Instance.new(\"TextLabel\")\n" +
"avisoKey.Size = UDim2.new(1, -40, 0, 25)\n" +
"avisoKey.Position = UDim2.new(0, 20, 1, -28)\n" +
"avisoKey.BackgroundTransparency = 1\n" +
"avisoKey.Text = \"\"\n" +
"avisoKey.TextColor3 = Color3.fromRGB(255, 100, 100)\n" +
"avisoKey.TextSize = 14\n" +
"avisoKey.Font = Enum.Font.Gotham\n" +
"avisoKey.Parent = telaKey\n" +
"\n" +
"-- MENU\n" +
"local menu = Instance.new(\"Frame\")\n" +
"menu.Size = UDim2.new(0, 280, 0, 360)\n" +
"menu.Position = UDim2.new(0.5, -140, 0.5, -180)\n" +
"menu.BackgroundColor3 = Color3.fromRGB(20, 20, 28)\n" +
"menu.Visible = false\n" +
"menu.Parent = gui\n" +
"\n" +
"local cantoMenu = Instance.new(\"UICorner\")\n" +
"cantoMenu.CornerRadius = UDim.new(0, 18)\n" +
"cantoMenu.Parent = menu\n" +
"\n" +
"local titulo = Instance.new(\"TextLabel\")\n" +
"titulo.Size = UDim2.new(1, -50, 0, 50)\n" +
"titulo.Position = UDim2.new(0, 15, 0, 5)\n" +
"titulo.BackgroundTransparency = 1\n" +
"titulo.Text = \"JOGADORES\"\n" +
"titulo.TextColor3 = Color3.new(1,1,1)\n" +
"titulo.TextSize = 20\n" +
"titulo.Font = Enum.Font.GothamBold\n" +
"titulo.TextXAlignment = Enum.TextXAlignment.Left\n" +
"titulo.Parent = menu\n" +
"\n" +
"local fechar = Instance.new(\"TextButton\")\n" +
"fechar.Size = UDim2.new(0, 40, 0, 40)\n" +
"fechar.Position = UDim2.new(1, -45, 0, 8)\n" +
"fechar.BackgroundTransparency = 1\n" +
"fechar.Text = \"X\"\n" +
"fechar.TextColor3 = Color3.fromRGB(255, 100, 100)\n" +
"fechar.TextSize = 22\n" +
"fechar.Font = Enum.Font.GothamBold\n" +
"fechar.Parent = menu\n" +
"\n" +
"local lista = Instance.new(\"ScrollingFrame\")\n" +
"lista.Size = UDim2.new(1, -20, 1, -65)\n" +
"lista.Position = UDim2.new(0, 10, 0, 60)\n" +
"lista.BackgroundTransparency = 1\n" +
"lista.BorderSizePixel = 0\n" +
"lista.ScrollBarThickness = 4\n" +
"lista.Parent = menu\n" +
"\n" +
"local layout = Instance.new(\"UIListLayout\")\n" +
"layout.Padding = UDim.new(0, 8)\n" +
"layout.Parent = lista\n" +
"\n" +
"-- TELEPORTAR\n" +
"local function teleportarPara(alvo)\n" +
"  if not alvo.Character then return end\n" +
"  local meuPersonagem = jogador.Character\n" +
"  if not meuPersonagem then return end\n" +
"  local minhaParte = meuPersonagem:FindFirstChild(\"HumanoidRootPart\")\n" +
"  local parteAlvo = alvo.Character:FindFirstChild(\"HumanoidRootPart\")\n" +
"  if minhaParte and parteAlvo then\n" +
"    minhaParte.CFrame = parteAlvo.CFrame * CFrame.new(3, 0, 0)\n" +
"  end\n" +
"end\n" +
"\n" +
"-- LISTA\n" +
"local function atualizarLista()\n" +
"  for _, obj in ipairs(lista:GetChildren()) do\n" +
"    if obj:IsA(\"TextButton\") then obj:Destroy() end\n" +
"  end\n" +
"  for _, alvo in ipairs(Players:GetPlayers()) do\n" +
"    if alvo ~= jogador then\n" +
"      local botao = Instance.new(\"TextButton\")\n" +
"      botao.Size = UDim2.new(1, -5, 0, 50)\n" +
"      botao.BackgroundColor3 = Color3.fromRGB(35, 35, 48)\n" +
"      botao.Text = \"  \" .. alvo.DisplayName\n" +
"      botao.TextColor3 = Color3.new(1,1,1)\n" +
"      botao.TextSize = 16\n" +
"      botao.Font = Enum.Font.GothamSemibold\n" +
"      botao.TextXAlignment = Enum.TextXAlignment.Left\n" +
"      botao.Parent = lista\n" +
"      local cb = Instance.new(\"UICorner\")\n" +
"      cb.CornerRadius = UDim.new(0, 12)\n" +
"      cb.Parent = botao\n" +
"      botao.MouseButton1Click:Connect(function()\n" +
"        teleportarPara(alvo)\n" +
"      end)\n" +
"    end\n" +
"  end\n" +
"  lista.CanvasSize = UDim2.new(0, 0, 0, layout.AbsoluteContentSize.Y + 10)\n" +
"end\n" +
"\n" +
"Players.PlayerAdded:Connect(atualizarLista)\n" +
"Players.PlayerRemoving:Connect(atualizarLista)\n" +
"\n" +
"layout:GetPropertyChangedSignal(\"AbsoluteContentSize\"):Connect(function()\n" +
"  lista.CanvasSize = UDim2.new(0, 0, 0, layout.AbsoluteContentSize.Y + 10)\n" +
"end)\n" +
"\n" +
"-- ABRIR\n" +
"abrir.MouseButton1Click:Connect(function()\n" +
"  if jaValidou then\n" +
"    menu.Visible = true\n" +
"    atualizarLista()\n" +
"  else\n" +
"    telaKey.Visible = true\n" +
"    caixaKey.Text = \"\"\n" +
"    avisoKey.Text = \"\"\n" +
"  end\n" +
"end)\n" +
"\n" +
"-- CONFIRMAR KEY\n" +
"botaoConfirmar.MouseButton1Click:Connect(function()\n" +
"  local digitada = caixaKey.Text:upper()\n" +
"  if digitada == \"\" then\n" +
"    avisoKey.Text = \"Digite uma key!\"\n" +
"    return\n" +
"  end\n" +
"  if keyValida(digitada) then\n" +
"    jaValidou = true\n" +
"    avisoKey.Text = \"Key valida!\"\n" +
"    avisoKey.TextColor3 = Color3.fromRGB(100, 255, 150)\n" +
"    task.wait(0.5)\n" +
"    telaKey.Visible = false\n" +
"    menu.Visible = true\n" +
"    atualizarLista()\n" +
"  else\n" +
"    avisoKey.Text = \"Key invalida!\"\n" +
"    avisoKey.TextColor3 = Color3.fromRGB(255, 100, 100)\n" +
"  end\n" +
"end)\n" +
"\n" +
"-- OBTER KEY\n" +
"botaoObter.MouseButton1Click:Connect(function()\n" +
"  game:GetService(\"GuiService\"):OpenBrowserWindow(\"https://miguelraulino777mn-lang.github.io/obter-keys\")\n" +
"end)\n" +
"\n" +
"-- FECHAR\n" +
"fechar.MouseButton1Click:Connect(function()\n" +
"  menu.Visible = false\n" +
"end)\n" +
"\n" +
"atualizarLista()";

  function verScript() {
    document.getElementById("script").value = SCRIPT_LUA;
    document.querySelectorAll(".tela").forEach(t => t.classList.remove("ativa"));
    document.getElementById("tela2").classList.add("ativa");
  }

  function copiarScript() {
    const script = document.getElementById("script");
    script.select();
    script.setSelectionRange(0, 999999);
    navigator.clipboard.writeText(SCRIPT_LUA).then(() => {
      const btn = document.getElementById("btnCopiar");
      const original = btn.innerText;
      btn.innerText = "✅ Copiado!";
      setTimeout(() => btn.innerText = original, 1500);
    });
  }

  function irParaKey() {
    window.open("https://miguelraulino777mn-lang.github.io/obter-keys", "_blank");
  }
</script>
</body>
</html>
